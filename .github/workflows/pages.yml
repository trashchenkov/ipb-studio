name: Publish IPB Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'fault.js'
      - 'circuit.js'
      - 'thermal.js'
      - 'thermal_ui.js'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ["Publish validated FEMM results"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp fault.js _site/fault.js
          cp circuit.js _site/circuit.js
          cp thermal.js _site/thermal.js
          cp thermal_ui.js _site/thermal_ui.js
          if [ -d results ]; then cp -r results _site/results; fi
          touch _site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for artifact visibility
        run: sleep 20
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
