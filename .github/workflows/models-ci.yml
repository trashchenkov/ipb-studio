name: Verify electrical models

on:
  push:
    branches: [main]
    paths:
      - 'circuit.js'
      - 'fault.js'
      - 'thermal.js'
      - 'thermal_ui.js'
      - 'femm/**'
      - 'tests/**'
      - '.github/workflows/models-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check circuit.js
          node --check fault.js
          node --check thermal.js
          node --check thermal_ui.js
      - name: Model regression tests
        run: node --test tests/*.test.js
      - name: FEMM Lua generator regression tests
        run: python -m unittest discover -s tests -p 'test_femm_fault.py' -v
